<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register — Aura AI 2.0</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <nav>
    <span class="brand">Aura AI 2.0</span>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
      <a href="register.html" class="active">Register</a>
      <a href="chat.html">Chat</a>
      <a href="api-test.html">API Test</a>
    </div>
  </nav>
  <main>
    <h1>Register</h1>
    <form id="registerForm">
      <label>Name</label>
      <input type="text" id="name" placeholder="Your name" required/>
      <label>Email</label>
      <input type="email" id="email" placeholder="alex@example.com" required/>
      <label>Password (min 8 chars)</label>
      <input type="password" id="password" placeholder="Password" required minlength="8"/>
      <button type="submit" class="btn">Create Account</button>
      <p class="error-msg" id="errMsg"></p>
      <p class="success-msg" id="successMsg"></p>
    </form>
    <div id="result" style="display:none; margin-top:1.5rem;">
      <h2>Response</h2>
      <pre id="resultDisplay"></pre>
    </div>
  </main>
  <script src="js/api.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async e => {
      e.preventDefault();
      document.getElementById('errMsg').textContent = '';
      document.getElementById('successMsg').textContent = '';
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      try {
        const data = await apiFetch('/api/v1/auth/register', {
          method: 'POST',
          body: JSON.stringify({ name, email, password })
        });
        localStorage.setItem('access_token', data.tokens.access_token);
        localStorage.setItem('refresh_token', data.tokens.refresh_token);
        localStorage.setItem('user', JSON.stringify(data.user));
        document.getElementById('successMsg').textContent = `✅ Account created! Welcome, ${data.user.name}`;
        document.getElementById('result').style.display = 'block';
        document.getElementById('resultDisplay').textContent = JSON.stringify(data, null, 2);
        setTimeout(() => location.href = 'chat.html', 1200);
      } catch(err) {
        document.getElementById('errMsg').textContent = '❌ ' + err.message;
      }
    });
  </script>
</body>
</html>
