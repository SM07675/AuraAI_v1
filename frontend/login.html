<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Aura AI 2.0</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <nav>
    <span class="brand">Aura AI 2.0</span>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="login.html" class="active">Login</a>
      <a href="register.html">Register</a>
      <a href="chat.html">Chat</a>
      <a href="api-test.html">API Test</a>
    </div>
  </nav>
  <main>
    <h1>Login</h1>
    <form id="loginForm">
      <label>Email</label>
      <input type="email" id="email" placeholder="alex@example.com" required/>
      <label>Password</label>
      <input type="password" id="password" placeholder="Password" required/>
      <button type="submit" class="btn">Login</button>
      <p class="error-msg" id="errMsg"></p>
      <p class="success-msg" id="successMsg"></p>
    </form>
    <p style="margin-top:1rem; font-size:0.85rem; color:#a0a0b0">
      No account? <a href="register.html" style="color:#7c6ef5">Register</a>
    </p>
    <div id="tokenBox" style="display:none; margin-top:1.5rem;">
      <h2>Access Token</h2>
      <pre id="tokenDisplay"></pre>
    </div>
  </main>
  <script src="js/api.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      document.getElementById('errMsg').textContent = '';
      document.getElementById('successMsg').textContent = '';
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      try {
        const data = await apiFetch('/api/v1/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password })
        });
        localStorage.setItem('access_token', data.tokens.access_token);
        localStorage.setItem('refresh_token', data.tokens.refresh_token);
        localStorage.setItem('user', JSON.stringify(data.user));
        document.getElementById('successMsg').textContent = `✅ Logged in as ${data.user.name}`;
        document.getElementById('tokenBox').style.display = 'block';
        document.getElementById('tokenDisplay').textContent = JSON.stringify(data, null, 2);
        setTimeout(() => location.href = 'chat.html', 1000);
      } catch(err) {
        document.getElementById('errMsg').textContent = '❌ ' + err.message;
      }
    });
  </script>
</body>
</html>
