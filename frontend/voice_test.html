<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura AI 2.0 – Voice Engine Test</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; margin: 2rem; background: #111; color: #eee; }
        .container { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 1rem; }
        .card { background: #222; padding: 1.5rem; border-radius: 8px; border: 1px solid #333; }
        .row { display: flex; gap: 1rem; align-items: center; justify-content: space-between; }
        button { padding: 0.75rem 1.5rem; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        #startBtn { background: #10b981; color: white; }
        #stopBtn { background: #ef4444; color: white; display: none; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .badge { padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.875rem; font-weight: bold; }
        .status-idle { background: #4b5563; color: white; }
        .status-active { background: #3b82f6; color: white; }
        .status-speaking { background: #a855f7; color: white; }
        .status-error { background: #ef4444; color: white; }
        
        .transcript-box { min-height: 80px; background: #000; padding: 1rem; border-radius: 4px; font-family: monospace; white-space: pre-wrap; margin-top: 0.5rem; }
        .partial { color: #9ca3af; }
        .final { color: #fff; }
        .ai-text { color: #10b981; }
        .interrupted { color: #f59e0b; text-decoration: line-through; }
        
        .metrics { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.5rem; font-size: 0.875rem; }
        .metric-label { color: #9ca3af; }
        .metric-value { font-weight: bold; font-family: monospace; }
        
        /* Mic Activity Meter */
        .meter-container { height: 10px; background: #333; border-radius: 5px; overflow: hidden; margin-top: 0.5rem; }
        .meter-fill { height: 100%; width: 0%; background: #10b981; transition: width 0.1s ease-out; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Aura AI 2.0 – Voice Engine Test</h1>
        
        <div class="card">
            <div class="row">
                <div>
                    <strong>Connection: </strong><span id="connStatus">Disconnected</span>
                    <br>
                    <strong>State: </strong><span id="sessionState" class="badge status-idle">IDLE</span>
                </div>
                <div>
                    <button id="startBtn">Start Session</button>
                    <button id="stopBtn">Stop Session</button>
                </div>
            </div>
            
            <div style="margin-top: 1rem;">
                <strong>Microphone Activity:</strong>
                <div class="meter-container"><div id="micMeter" class="meter-fill"></div></div>
            </div>
        </div>

        <div class="card">
            <strong>User Transcript:</strong>
            <div id="transcriptBox" class="transcript-box"><span class="partial">Waiting for speech...</span></div>
        </div>

        <div class="card">
            <strong>AI Response:</strong>
            <div id="aiBox" class="transcript-box"></div>
        </div>

        <div class="card">
            <strong>Latency Metrics (Last Turn):</strong>
            <div class="metrics" id="metricsBox">
                <div><span class="metric-label">STT Latency: </span><span class="metric-value" id="m-stt">-</span></div>
                <div><span class="metric-label">First Token: </span><span class="metric-value" id="m-token">-</span></div>
                <div><span class="metric-label">First Audio: </span><span class="metric-value" id="m-audio">-</span></div>
                <div><span class="metric-label">Total Turn: </span><span class="metric-value" id="m-total">-</span></div>
                <div><span class="metric-label">Interrupts: </span><span class="metric-value" id="m-interrupts">0</span></div>
            </div>
        </div>
    </div>

    <script>
        const WS_URL = "ws://localhost:8000/api/v1/ws/voice";
        
        // UI Elements
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const connStatus = document.getElementById('connStatus');
        const sessionState = document.getElementById('sessionState');
        const transcriptBox = document.getElementById('transcriptBox');
        const aiBox = document.getElementById('aiBox');
        const micMeter = document.getElementById('micMeter');
        
        // Audio & WebSocket state
        let ws = null;
        let audioContext = null;
        let mediaStream = null;
        let processor = null;
        let playQueue = [];
        let isPlaying = false;
        let audioSourceNode = null;
        
        let currentPartial = "";
        let currentFinal = "";
        let currentAiResponse = "";

        // --- Audio Capture (Mic -> 16kHz PCM -> WS) ---
        
        async function startAudioCapture() {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true }});
                
                // AudioContext at 16kHz to match STT/VAD requirements natively (if supported by browser)
                audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
                
                const source = audioContext.createMediaStreamSource(mediaStream);
                
                // Using ScriptProcessorNode for simplicity in this demo (AudioWorklet is better for prod)
                processor = audioContext.createScriptProcessor(4096, 1, 1);
                
                source.connect(processor);
                processor.connect(audioContext.destination);
                
                processor.onaudioprocess = (e) => {
                    if (!ws || ws.readyState !== WebSocket.OPEN) return;
                    
                    const float32Data = e.inputBuffer.getChannelData(0);
                    
                    // Update meter UI
                    let sum = 0;
                    for (let i = 0; i < float32Data.length; i++) sum += float32Data[i] * float32Data[i];
                    const rms = Math.sqrt(sum / float32Data.length);
                    micMeter.style.width = Math.min(100, rms * 500) + "%";
                    
                    // Convert Float32 to Int16 PCM
                    const pcmData = new Int16Array(float32Data.length);
                    for (let i = 0; i < float32Data.length; i++) {
                        let s = Math.max(-1, Math.min(1, float32Data[i]));
                        pcmData[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                    }
                    
                    // Send binary frame
                    ws.send(pcmData.buffer);
                };
                
            } catch (err) {
                console.error("Mic access error:", err);
                alert("Could not access microphone: " + err.message);
                stopSession();
            }
        }
        
        function stopAudioCapture() {
            if (processor) { processor.disconnect(); processor = null; }
            if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
            if (audioContext && audioContext.state !== 'closed') { audioContext.close(); audioContext = null; }
            micMeter.style.width = "0%";
            stopPlayback();
        }

        // --- Audio Playback (WS base64 -> MP3 AudioBuffer -> Speaker) ---
        
        async function queueAudioChunk(base64Data) {
            if (!audioContext) return;
            
            try {
                // Decode base64 to ArrayBuffer
                const binaryStr = window.atob(base64Data);
                const len = binaryStr.length;
                const bytes = new Uint8Array(len);
                for (let i = 0; i < len; i++) bytes[i] = binaryStr.charCodeAt(i);
                
                // Decode MP3 chunk
                const audioBuffer = await audioContext.decodeAudioData(bytes.buffer);
                playQueue.push(audioBuffer);
                
                if (!isPlaying) playNextChunk();
            } catch (e) {
                console.error("Audio decode error:", e);
            }
        }
        
        function playNextChunk() {
            if (playQueue.length === 0) {
                isPlaying = false;
                audioSourceNode = null;
                return;
            }
            
            isPlaying = true;
            const buffer = playQueue.shift();
            audioSourceNode = audioContext.createBufferSource();
            audioSourceNode.buffer = buffer;
            audioSourceNode.connect(audioContext.destination);
            
            audioSourceNode.onended = () => {
                playNextChunk();
            };
            
            audioSourceNode.start(0);
        }
        
        function stopPlayback() {
            playQueue = [];
            isPlaying = false;
            if (audioSourceNode) {
                try { audioSourceNode.stop(); } catch(e){}
                audioSourceNode = null;
            }
        }

        // --- WebSocket Protocol ---

        function connect() {
            connStatus.innerText = "Connecting...";
            ws = new WebSocket(WS_URL);
            ws.binaryType = "arraybuffer";
            
            ws.onopen = async () => {
                connStatus.innerText = "Connected";
                connStatus.style.color = "#10b981";
                
                // Start mic capture
                await startAudioCapture();
                
                // Send session start
                ws.send(JSON.stringify({ type: "session_start", user_id: 0 }));
            };
            
            ws.onmessage = (event) => {
                if (typeof event.data !== "string") return; // Ignore incoming binary for now (we use JSON for audio_chunk)
                
                try {
                    const msg = JSON.parse(event.data);
                    handleMessage(msg);
                } catch(e) {
                    console.error("WS parse error:", e);
                }
            };
            
            ws.onclose = () => {
                connStatus.innerText = "Disconnected";
                connStatus.style.color = "#ef4444";
                updateState("DISCONNECTED");
                stopAudioCapture();
                
                startBtn.style.display = "inline-block";
                stopBtn.style.display = "none";
            };
            
            ws.onerror = (err) => {
                console.error("WS error:", err);
            };
        }
        
        function handleMessage(msg) {
            console.log("RX:", msg.type, msg);
            
            switch (msg.type) {
                case "state_change":
                    updateState(msg.state);
                    if (msg.state === "LISTENING") {
                        currentPartial = "";
                        updateTranscriptUI();
                    }
                    break;
                    
                case "partial_transcript":
                    currentPartial = msg.text;
                    updateTranscriptUI();
                    break;
                    
                case "final_transcript":
                    currentFinal += (currentFinal ? "\n" : "") + msg.text;
                    currentPartial = "";
                    currentAiResponse = ""; // clear old AI response on new turn
                    aiBox.innerHTML = "";
                    updateTranscriptUI();
                    break;
                    
                case "partial_response":
                    currentAiResponse += msg.text;
                    aiBox.innerHTML = `<span class="ai-text">${currentAiResponse}</span>`;
                    break;
                    
                case "audio_chunk":
                    queueAudioChunk(msg.data);
                    break;
                    
                case "interrupted":
                    stopPlayback();
                    aiBox.innerHTML += ` <span class="interrupted">[Interrupted]</span>`;
                    break;
                    
                case "metrics":
                    updateMetrics(msg.data);
                    break;
                    
                case "error":
                    alert("Server Error: " + msg.message);
                    updateState("ERROR");
                    break;
            }
        }
        
        function updateState(state) {
            sessionState.innerText = state;
            sessionState.className = "badge";
            if (state === "LISTENING") sessionState.classList.add("status-active");
            else if (state === "SPEAKING") sessionState.classList.add("status-speaking");
            else if (state === "ERROR") sessionState.classList.add("status-error");
            else sessionState.classList.add("status-idle");
        }
        
        function updateTranscriptUI() {
            let html = "";
            if (currentFinal) html += `<span class="final">${currentFinal}</span><br>`;
            if (currentPartial) html += `<span class="partial">${currentPartial}</span>`;
            if (!currentFinal && !currentPartial) html = `<span class="partial">Waiting for speech...</span>`;
            transcriptBox.innerHTML = html;
        }
        
        function updateMetrics(data) {
            if (data.current_turn) {
                document.getElementById('m-stt').innerText = data.current_turn.stt_latency_ms + " ms";
                document.getElementById('m-token').innerText = data.current_turn.first_token_latency_ms + " ms";
                document.getElementById('m-audio').innerText = data.current_turn.first_audio_latency_ms + " ms";
                document.getElementById('m-total').innerText = data.current_turn.total_turn_ms + " ms";
            } else if (data.last_turn) {
                document.getElementById('m-stt').innerText = data.last_turn.stt_latency_ms + " ms";
                document.getElementById('m-token').innerText = data.last_turn.first_token_latency_ms + " ms";
                document.getElementById('m-audio').innerText = data.last_turn.first_audio_latency_ms + " ms";
                document.getElementById('m-total').innerText = data.last_turn.total_turn_ms + " ms";
            }
            document.getElementById('m-interrupts').innerText = data.interrupt_count;
        }

        // --- Button Handlers ---
        
        startBtn.onclick = () => {
            startBtn.style.display = "none";
            stopBtn.style.display = "inline-block";
            currentFinal = "";
            currentPartial = "";
            currentAiResponse = "";
            updateTranscriptUI();
            aiBox.innerHTML = "";
            connect();
        };
        
        function stopSession() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: "stop_session" }));
                setTimeout(() => { ws.close(); }, 500);
            }
            stopAudioCapture();
            startBtn.style.display = "inline-block";
            stopBtn.style.display = "none";
        }
        
        stopBtn.onclick = stopSession;
    </script>
</body>
</html>
