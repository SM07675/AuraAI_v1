<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chat — Aura AI 2.0</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <nav>
    <span class="brand">Aura AI 2.0</span>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
      <a href="register.html">Register</a>
      <a href="chat.html" class="active">Chat</a>
      <a href="api-test.html">API Test</a>
    </div>
    <button onclick="logout()">Logout</button>
  </nav>
  <div class="chat-container">
    <div class="messages" id="messages">
      <div class="message system">🤖 Connected to Aura AI 2.0. Type a message to begin.</div>
    </div>
    <div class="chat-input">
      <textarea id="msgInput" placeholder="Type your message..." onkeydown="handleKey(event)"></textarea>
      <button class="btn" onclick="sendMessage()">Send</button>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script>
    let sessionId = null;
    let sending = false;

    function logout() { localStorage.clear(); location.href = 'login.html'; }

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    }

    function addMessage(role, content) {
      const el = document.createElement('div');
      el.className = `message ${role}`;
      el.textContent = content;
      document.getElementById('messages').appendChild(el);
      el.scrollIntoView({ behavior: 'smooth' });
      return el;
    }

    async function sendMessage() {
      if (sending) return;
      const input = document.getElementById('msgInput');
      const content = input.value.trim();
      if (!content) return;

      const token = localStorage.getItem('access_token');
      if (!token) { location.href = 'login.html'; return; }

      input.value = '';
      addMessage('user', content);
      sending = true;

      // Streaming SSE
      const assistantEl = addMessage('assistant', '...');
      let fullText = '';

      try {
        const response = await fetch('/api/v1/chat/send', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ content, session_id: sessionId })
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          const text = decoder.decode(value);
          const lines = text.split('\n');
          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            try {
              const event = JSON.parse(line.slice(6));
              if (event.type === 'session_start') {
                sessionId = event.session_id;
                addMessage('system', `📎 Session #${sessionId}`);
              } else if (event.type === 'chunk') {
                fullText += event.content;
                assistantEl.textContent = fullText;
                assistantEl.scrollIntoView({ behavior: 'smooth' });
              } else if (event.type === 'emotion') {
                const emo = event.data.fused_emotion || 'unknown';
                const conf = event.data.confidence || 0;
                addMessage('system', `😊 Detected emotion: ${emo} (${conf.toFixed(0)}%)`);
              } else if (event.type === 'error') {
                assistantEl.textContent = '❌ ' + event.error;
              }
            } catch {}
          }
        }
      } catch(err) {
        assistantEl.textContent = '❌ Connection error: ' + err.message;
      } finally {
        sending = false;
      }
    }

    // Redirect to login if not authenticated
    if (!localStorage.getItem('access_token')) location.href = 'login.html';
  </script>
</body>
</html>
