[project]
name = "aura-ai-backend"
version = "2.0.0"
description = "Aura AI 2.0 — Production-grade conversational AI backend"
requires-python = ">=3.12"
dependencies = [
    # --- Web Framework ---
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.30.0,<1.0",
    "python-multipart>=0.0.9",

    # --- Database ---
    "sqlalchemy[asyncio]>=2.0.30,<3.0",
    "asyncpg>=0.29.0,<1.0",
    "alembic>=1.13.0,<2.0",

    # --- Redis ---
    "redis[hiredis]>=5.0.0,<6.0",

    # --- Authentication ---
    "email-validator>=2.1.0",
    "pyjwt>=2.8.0,<3.0",
    "passlib[bcrypt]>=1.7.4,<2.0",
    "bcrypt>=4.1.0,<5.0",

    # --- Configuration ---
    "pydantic>=2.7.0,<3.0",
    "pydantic-settings>=2.3.0,<3.0",

    # --- HTTP Client (AI providers) ---
    "httpx>=0.27.0,<1.0",

    # --- Logging ---
    "structlog>=24.1.0,<25.0",

    # --- TTS ---
    "edge-tts>=6.1.0",

    # --- Template rendering ---
    "jinja2>=3.1.0,<4.0",

    # --- Utilities ---
    "python-dateutil>=2.9.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<9.0",
    "pytest-asyncio>=0.23.0,<1.0",
    "httpx>=0.27.0,<1.0",
    "anyio>=4.4.0,<5.0",
    "coverage>=7.5.0,<8.0",
    "ruff>=0.4.0,<1.0",
    "mypy>=1.10.0,<2.0",
]

[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
